<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Joke Generator</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.3);
            padding: 40px;
            max-width: 600px;
            width: 100%;
            text-align: center;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            font-size: 2.5em;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 1.1em;
        }

        .joke-box {
            background: #f8f9fa;
            border-left: 5px solid #667eea;
            padding: 25px;
            border-radius: 8px;
            margin-bottom: 30px;
            min-height: 100px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .joke-text {
            color: #333;
            font-size: 1.2em;
            line-height: 1.6;
            font-weight: 500;
        }

        .joke-setup {
            margin-bottom: 15px;
            font-weight: 600;
        }

        .joke-delivery {
            margin-top: 15px;
            font-style: italic;
            color: #555;
        }

        .loading {
            color: #667eea;
            font-style: italic;
        }

        button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 40px;
            font-size: 1.1em;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            font-weight: 600;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .error {
            color: #e74c3c;
            background: #fadbd8;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .category-info {
            color: #999;
            font-size: 0.9em;
            margin-top: 15px;
        }

        .emoji {
            font-size: 3em;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="emoji">😂</div>
        <h1>Joke Generator</h1>
        <p class="subtitle">Get a random laugh!</p>

        <div id="errorMessage" class="error" style="display: none;"></div>

        <div class="joke-box">
            <div id="jokeDisplay" class="joke-text">Click the button to get a joke!</div>
        </div>

        <button id="jokeButton" onclick="fetchJoke()">Get a Joke</button>
        <p class="category-info">Powered by JokeAPI</p>
    </div>

    <script>
        async function fetchJoke() {
            const button = document.getElementById('jokeButton');
            const jokeDisplay = document.getElementById('jokeDisplay');
            const errorMessage = document.getElementById('errorMessage');

            // Disable button and show loading state
            button.disabled = true;
            jokeDisplay.innerHTML = '<span class="loading">Loading a joke...</span>';
            errorMessage.style.display = 'none';

            try {
                // Fetch from JokeAPI
                const response = await fetch('https://v2.jokeapi.dev/joke/Any?type=single');

                if (!response.ok) {
                    throw new Error('Failed to fetch joke');
                }

                const data = await response.json();

                // Check if the API returned an error
                if (data.error) {
                    throw new Error('API returned an error');
                }

                // Display the joke
                if (data.type === 'single') {
                    // Single line joke
                    jokeDisplay.innerHTML = `
                        <div class="joke-text">${data.joke}</div>
                    `;
                } else if (data.type === 'twopart') {
                    // Two-part joke (setup and delivery)
                    jokeDisplay.innerHTML = `
                        <div>
                            <div class="joke-setup">${data.setup}</div>
                            <div class="joke-delivery">${data.delivery}</div>
                        </div>
                    `;
                }

                // Add category info
                const categoryInfo = document.querySelector('.category-info');
                categoryInfo.textContent = `Category: ${data.category} | Powered by JokeAPI`;

            } catch (error) {
                console.error('Error:', error);
                jokeDisplay.innerHTML = '<span class="loading">Click the button to try again</span>';
                errorMessage.textContent = '❌ Oops! Could not fetch a joke. Please try again.';
                errorMessage.style.display = 'block';
            } finally {
                // Re-enable button
                button.disabled = false;
            }
        }

        // Fetch a joke when the page loads
        window.addEventListener('load', () => {
            fetchJoke();
        });
    </script>
</body>
</html>
